[package]
name = "firebat-cc-gui"
version = "0.1.0"
edition = "2021"
description = "Firebat GX 控制中心图形前端（Slint）"
license = "GPL-2.0+"

[dependencies]
# Slint 1.18：winit 后端 + femtovg 渲染器，X11 与 Wayland 均可运行
slint = { version = "1.18", default-features = false, features = [
    "std",
    "backend-winit",
    "backend-winit-x11",
    "backend-winit-wayland",
    "renderer-winit-femtovg",
    "renderer-software",
    "software-renderer-systemfonts",
    "compat-1-2",
    "unstable-winit-030",
] }
serde_json = "1"
# 原生 Linux StatusNotifierItem 托盘，不依赖 GTK/AppIndicator C 库。
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
smithay-client-toolkit = { version = "0.19.2", default-features = false }
wayland-client = "0.31"
libc = "0.2"

[build-dependencies]
slint-build = "1.18"

# 仅 examples/screenshot.rs（离线预览渲染）使用
[dev-dependencies]
rgb = "0.8"

# 发布配置由工作区根 Cargo.toml 统一提供（见根目录 [profile.release]）
